spring.application.name=safarismart-tz

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/safarismart}
spring.datasource.username=${DB_USERNAME:safarismart_user}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false


# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}



# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Server ---
server.port=${SERVER_PORT:8080}